name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Install audit test tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - run: node scripts/validate-plugins.mjs
      - run: node scripts/generate-pstack-harness-trees.mjs --check
      - run: node scripts/check-pstack-docs.mjs
      - name: Test native runtime, compiler and packaging contracts
        run: npm test

  bun-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - pstack/skills/poteto-mode/scripts
          - orchestrate/skills/orchestrate/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Test and typecheck source tools
        working-directory: ${{ matrix.directory }}
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run typecheck

  statechart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck:statechart
      - name: Install TLC
        run: |
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Test statechart with real TLC and no skipped tests
        shell: bash
        run: |
          test -s "$TLA2TOOLS"
          npm run test:statechart | tee "$RUNNER_TEMP/statechart.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/statechart.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/statechart.tap"

  native-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: codex
            package: '@openai/codex@0.165.0'
          - host: claude
            package: '@anthropic-ai/claude-code@2.1.312'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install pinned native CLI
        env:
          CLI_PACKAGE: ${{ matrix.package }}
        run: npm install --global "$CLI_PACKAGE"
      - name: Install and discover the standalone package in an isolated home
        env:
          HOST: ${{ matrix.host }}
        run: python3 scripts/check-native-install.py "$HOST" --require

  port-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install checksum-pinned Lean for repository verification
        run: bash verification/lean/install.sh "$RUNNER_TEMP/lean"
      - name: Check port proofs, compiler correspondence and negative controls
        env:
          LEAN: ${{ runner.temp }}/lean/bin/lean
        run: npm run verify:lean
